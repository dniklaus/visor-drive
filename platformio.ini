#
# Project Configuration File
#
# A detailed documentation with the EXAMPLES is located here:
# http://docs.platformio.org/en/latest/projectconf.html
#

# A sign `#` at the beginning of the line indicates a comment
# Comment lines are ignored.

# Simple and base environment
# [env:mybaseenv]
# platform = %INSTALLED_PLATFORM_NAME_HERE%
# framework =
# board =
#
# Automatic targets - enable auto-uploading
# targets = upload

[platformio]
default_envs = 
  ; featherm0
  ; d1_mini
  ; huzzah
  ; nodemcu
  ; esp32doit-devkit-v1
  lolin32
  ; due
  ; mega2560
  ; nucleo_f411re

[common]
build_flags_ext =


lib_deps_builtin = 
  SPI
  Wire
lib_deps_external = 
  dniklaus/spin-timer@>=3.0.0
  ERNICommunity/dbg-trace@>=1.1.0
  ERNICommunity/debug-cli@>=1.3.0
  madhephaestus/ESP32Servo@^3.0.6
  https://github.com/dniklaus/Arduino-SerialCommand
  https://github.com/dniklaus/wiring-app-debug
  https://github.com/dniklaus/arduino-utils-mem
  https://github.com/dniklaus/indicator
  https://github.com/dniklaus/indicator-dbg
  https://github.com/dniklaus/button
  bblanchon/ArduinoJson
  https://github.com/256dpi/arduino-mqtt
  https://github.com/ERNICommunity/mqtt-client
  https://github.com/dniklaus/Battery
  https://github.com/dniklaus/CmdSequence
  https://github.com/dniklaus/servo-axis.git

 
[env:lolin32]
platform = espressif32
framework = arduino
board = lolin32
build_flags =
  ${common.build_flags_ext}
  -DBOARD_LOLIN_D32
lib_deps =
  ${common.lib_deps_builtin}
  ${common.lib_deps_external}

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
  ${common.build_flags_ext}
lib_deps =
  ${common.lib_deps_builtin}
  ${common.lib_deps_external}

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags =
  ${common.build_flags_ext}
lib_deps =
  ${common.lib_deps_builtin}
  ${common.lib_deps_external}

